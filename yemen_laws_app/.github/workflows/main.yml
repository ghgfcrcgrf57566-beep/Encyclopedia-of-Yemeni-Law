name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yemen_laws_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies for GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Create Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Restore Gradle wrapper
        run: gradle -p android wrapper --gradle-version 8.14

      - name: Verify Flutter project
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Run Flutter tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No Flutter test directory found; skipping flutter test."
          fi

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" --dart-define=APP_VERSION=1.0.0
