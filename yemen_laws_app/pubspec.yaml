name: yemen_law
description: "قوانين اليمن - Yemen Law: موسوعة قانونية يمنية تعمل بدون إنترنت"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # قاعدة البيانات المحلية
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.6

  # إدارة الحالة
  provider: ^6.1.2

  # المشاركة والنسخ
  share_plus: ^13.3.1

  # الإملاء الصوتي
  speech_to_text: ^7.0.0

  # حفظ تفضيلات المستخدم محليًا
  shared_preferences: ^2.2.3

  # فحص وجود اتصال بالإنترنت
  connectivity_plus: ^6.0.3

  # الاتصال الهاتفي من شاشة التواصل
  url_launcher: ^6.3.2
  http: ^1.5.0

  # المراجع القانونية: الفهرسة والتنزيل والقراءة الداخلية لملفات PDF
  dio: ^5.11.1
  flutter_pdfview: ^1.4.5
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/db/app_database.db
    - assets/icon/app_icon.jpg
    - assets/images/splash.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
