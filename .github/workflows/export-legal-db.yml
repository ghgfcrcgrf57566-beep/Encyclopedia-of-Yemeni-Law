name: Export legal database for RAG

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-legal-db.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source database
        shell: bash
        run: |
          set -euo pipefail
          DB="yemen_laws_app/assets/db/app_database.db"
          if [[ ! -s "$DB" ]]; then
            echo "::error::Source SQLite database is missing or empty: $DB"
            echo "The database may need to be generated by the app's existing build workflow first."
            exit 1
          fi
          python3 - "$DB" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          required = ("laws", "abwab", "fusul", "mawad")
          existing = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = [t for t in required if t not in existing]
          if missing:
              raise SystemExit("Missing required tables: " + ", ".join(missing))
          for table in required:
              print(f"{table}: {db.execute('SELECT COUNT(*) FROM ' + table).fetchone()[0]} rows")
          PY

      - name: Run repository export script
        run: |
          python3 yemen_laws_app/tools/export_rag_data.py \
            --db yemen_laws_app/assets/db/app_database.db \
            --out artifacts/legal-rag-export

      - name: Validate exported files and counts
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/legal-rag-export/seed.sql
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("artifacts/legal-rag-export")
          for table in ("laws", "abwab", "fusul", "mawad"):
              p = base / f"{table}.json"
              data = json.loads(p.read_text(encoding="utf-8"))
              print(f"Exported {table}: {len(data)} rows")
          print(f"seed.sql bytes: {(base / 'seed.sql').stat().st_size}")
          PY

      - name: Upload exported SQL and JSON
        uses: actions/upload-artifact@v4
        with:
          name: legal-rag-export
          path: artifacts/legal-rag-export/
          if-no-files-found: error
          retention-days: 7
