name: Deploy Legal AI Worker

on:
  push:
    branches: [main]
    paths:
      - "backend/legal-ai/**"
      - "yemen_laws_app/tools/export_rag_data.py"
      - "yemen_laws_app/assets/db/app_database.db"
      - ".github/workflows/deploy-legal-ai.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment mode
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$GEMINI_API_KEY" ]; then
            echo "mode=cloudflare" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is fully configured."
          elif [ -n "$GEMINI_API_KEY" ]; then
            echo "mode=gemini-only" >> "$GITHUB_OUTPUT"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment secrets are missing; running Gemini-only validation instead."
          else
            echo "mode=disabled" >> "$GITHUB_OUTPUT"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No deployment credentials are configured; skipping workflow steps."
          fi

      - name: Set up Node.js
        if: steps.config.outputs.mode != 'disabled'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        if: steps.config.outputs.mode != 'disabled'
        working-directory: backend/legal-ai
        run: npm install

      - name: Typecheck
        if: steps.config.outputs.mode != 'disabled'
        working-directory: backend/legal-ai
        run: npm run typecheck

      - name: Validate Gemini API directly
        if: steps.config.outputs.mode == 'gemini-only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl --fail --silent --show-error --location \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"Reply in Arabic with JSON {\"status\":\"ok\",\"provider\":\"gemini-direct\"}"}]}]}' \
            | python3 -c 'import sys, json; data=json.load(sys.stdin); print(data.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", ""));'

      - name: Ensure Vectorize index
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler vectorize list 2>/dev/null | grep -q "yemen-laws-articles"; then
            echo "Vectorize index already exists."
          else
            npx wrangler vectorize create yemen-laws-articles --dimensions=1024 --metric=cosine
          fi

      - name: Apply D1 schema
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute yemen_laws_db --remote --file=./schema.sql

      - name: Generate D1 seed from canonical SQLite database
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        run: |
          rm -rf data/generated
          mkdir -p data/generated
          python3 ../../yemen_laws_app/tools/export_rag_data.py \
            --db ../../yemen_laws_app/assets/db/app_database.db \
            --out ./data/generated

      - name: Import legal corpus to D1
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute yemen_laws_db --remote --file=./data/generated/seed.sql

      - name: Configure Gemini API secret
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      - name: Deploy Worker
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Semantic reindex legal corpus
        if: steps.config.outputs.mode == 'cloudflare'
        working-directory: backend/legal-ai
        env:
          LEGAL_AI_BASE_URL: https://odd-mouse-c1e0.ghgfcrcgrf57566.workers.dev
          REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}
        run: |
          if [ -z "$REINDEX_TOKEN" ]; then
            echo "REINDEX_TOKEN is not configured; semantic reindex is skipped. Lexical legal search remains available."
            exit 0
          fi
          bash scripts/reindex.sh

      - name: Verify Legal AI endpoints
        if: steps.config.outputs.mode == 'cloudflare'
        env:
          LEGAL_AI_BASE_URL: https://odd-mouse-c1e0.ghgfcrcgrf57566.workers.dev
          APP_VERSION: 1.0.0
        run: bash backend/legal-ai/scripts/test-endpoints.sh
