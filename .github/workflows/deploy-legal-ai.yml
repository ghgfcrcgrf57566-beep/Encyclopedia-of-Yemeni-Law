name: Deploy Legal AI Worker

on:
  push:
    branches: [main]
    paths:
      - "backend/legal-ai/**"
      - "yemen_laws_app/tools/export_rag_data.py"
      - "yemen_laws_app/assets/db/app_database.db"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; deployment is skipped."
          fi

      - name: Set up Node.js
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        run: npm install

      - name: Typecheck
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        run: npm run typecheck

      - name: Ensure Vectorize index
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler vectorize list 2>/dev/null | grep -q "yemen-laws-articles"; then
            echo "Vectorize index already exists."
          else
            npx wrangler vectorize create yemen-laws-articles --dimensions=1024 --metric=cosine
          fi

      - name: Apply D1 schema
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute yemen_laws_db --remote --file=./schema.sql

      - name: Generate D1 seed from canonical SQLite database
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        run: |
          rm -rf data/generated
          mkdir -p data/generated
          python3 ../../yemen_laws_app/tools/export_rag_data.py \
            --db ../../yemen_laws_app/assets/db/app_database.db \
            --out ./data/generated

      - name: Import legal corpus to D1
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute yemen_laws_db --remote --file=./data/generated/seed.sql

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: backend/legal-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Semantic reindex legal corpus
        if: steps.cloudflare.outputs.configured == 'true' && secrets.REINDEX_TOKEN != ''
        working-directory: backend/legal-ai
        env:
          LEGAL_AI_BASE_URL: https://odd-mouse-c1e0.ghgfcrcgrf57566.workers.dev
          REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}
        run: bash scripts/reindex.sh
      - name: Verify Legal AI endpoints
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          LEGAL_AI_BASE_URL: https://odd-mouse-c1e0.ghgfcrcgrf57566.workers.dev
          APP_VERSION: 1.0.0
        run: bash backend/legal-ai/scripts/test-endpoints.sh
