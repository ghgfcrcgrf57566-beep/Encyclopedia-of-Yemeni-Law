name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yemen_laws_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies for GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Create Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Restore Gradle wrapper
        run: gradle -p android wrapper --gradle-version 8.14

      - name: Verify Flutter project
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fix legal assistant source before analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/services/legal_ai_service.dart')
          text = path.read_text(encoding='utf-8')
          old = "'جميع', 'ماهي', 'هي',"
          new = "'جميع', 'ماهي',"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Removed duplicate stop-word entry: هي')
          else:
              print('Duplicate stop-word entry not present; no change needed.')
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos || true

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Run Flutter tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No Flutter test directory found; skipping flutter test."
          fi

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" --dart-define=APP_VERSION=1.0.0

      - name: Check if Supreme Court PDF release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "SC_BOOKS_VALIDATION_SKIPPED=false" >> "$GITHUB_ENV"
          else
            echo "No GitHub release v1.0.0 is published yet for Supreme Court PDFs; skipping external URL validation until the assets exist."
            echo "SC_BOOKS_VALIDATION_SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Validate Supreme Court PDF URLs
        if: env.SC_BOOKS_VALIDATION_SKIPPED != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          jq -r '.[].download_url' sc_books.json > /tmp/sc_book_urls.txt
          count=$(wc -l < /tmp/sc_book_urls.txt)
          if [ "$count" -ne 21 ]; then
            echo "Expected 21 Supreme Court PDF URLs, found $count"
            exit 1
          fi

          missing=0
          while IFS= read -r url; do
            echo "Checking $url"
            if ! curl -fsSLI --max-time 20 "$url" >/dev/null; then
              echo "MISSING: $url"
              missing=1
            fi
          done < /tmp/sc_book_urls.txt

          if [ "$missing" -ne 0 ]; then
            echo "One or more Supreme Court PDF assets are unavailable."
            exit 1
          else
            echo "All Supreme Court PDF URLs are reachable."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-law-apk
          path: yemen_laws_app/build/app/outputs/flutter-apk/app-release.apk
