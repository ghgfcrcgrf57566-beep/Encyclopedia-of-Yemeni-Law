name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yemen_laws_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Create Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Restore Gradle wrapper
        run: gradle -p android wrapper --gradle-version 8.14

      - name: Verify Flutter project
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        # Informational lints are non-fatal; real analyzer errors still fail CI.
        run: flutter analyze --no-fatal-infos

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Resolve LEGAL_AI_BASE_URL
        env:
          SECRET_LEGAL_AI_BASE_URL: ${{ secrets.LEGAL_AI_BASE_URL }}
        run: |
          set -e
          if [ -n "$SECRET_LEGAL_AI_BASE_URL" ]; then
            LEGAL_AI_BASE_URL="$SECRET_LEGAL_AI_BASE_URL"
          else
            LEGAL_AI_BASE_URL="https://odd-mouse-c1e0.ghgfcrcgrf57566.workers.dev"
          fi
          case "$LEGAL_AI_BASE_URL" in
            https://*) ;;
            *) echo "LEGAL_AI_BASE_URL must start with https://"; exit 1 ;;
          esac
          echo "LEGAL_AI_BASE_URL=$LEGAL_AI_BASE_URL" >> "$GITHUB_ENV"

      - name: Run Flutter tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No Flutter test directory found; skipping flutter test."
          fi

      - name: Check backend TypeScript
        working-directory: backend/legal-ai
        run: |
          npm install
          npm run typecheck

      - name: Build release APK
        run: flutter build apk --release --dart-define=LEGAL_AI_BASE_URL="$LEGAL_AI_BASE_URL"

      - name: Validate Supreme Court PDF URLs
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set +e
          jq -r '.[].download_url' sc_books.json > /tmp/sc_book_urls.txt
          count=$(wc -l < /tmp/sc_book_urls.txt)
          if [ "$count" -ne 21 ]; then
            echo "::warning::Expected 21 Supreme Court PDF URLs, found $count"
            exit 0
          fi

          missing=0
          while IFS= read -r url; do
            echo "Checking $url"
            if ! curl -fsSLI --max-time 20 "$url" >/dev/null; then
              echo "::warning::Supreme Court PDF unavailable: $url"
              missing=1
            fi
          done < /tmp/sc_book_urls.txt

          if [ "$missing" -ne 0 ]; then
            echo "::warning::One or more Supreme Court PDF assets are unavailable. APK build will continue; downloads will work once the referenced PDF assets are published."
          else
            echo "All Supreme Court PDF URLs are reachable."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-law-apk
          path: yemen_laws_app/build/app/outputs/flutter-apk/app-release.apk
