name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yemen_laws_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Create Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Verify Flutter and Android toolchain
        run: flutter doctor -v || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Supreme Court screen
        run: |
          test -f lib/screens/supreme_court_screen.dart
          grep -q "if (_error != null)" lib/screens/supreme_court_screen.dart
          grep -q "_error!" lib/screens/supreme_court_screen.dart
          echo "Supreme Court screen source is present and contains the corrected error UI."

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" --dart-define=APP_VERSION=1.0.0

      - name: Check if Supreme Court PDF release exists
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "SC_BOOKS_VALIDATION_SKIPPED=false" >> "$GITHUB_ENV"
          else
            echo "No GitHub release v1.0.0 is published yet; skipping external PDF URL validation."
            echo "SC_BOOKS_VALIDATION_SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Validate Supreme Court PDF URLs
        if: env.SC_BOOKS_VALIDATION_SKIPPED != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          test -f sc_books.json
          jq -e 'type == "array"' sc_books.json >/dev/null
          jq -r '.[].download_url' sc_books.json > /tmp/sc_book_urls.txt
          count=$(wc -l < /tmp/sc_book_urls.txt)
          if [ "$count" -ne 21 ]; then
            echo "Expected 21 Supreme Court PDF URLs, found $count"
            exit 1
          fi

          missing=0
          while IFS= read -r url; do
            echo "Checking $url"
            if ! curl -fsSLI --max-time 20 "$url" >/dev/null; then
              echo "MISSING: $url"
              missing=1
            fi
          done < /tmp/sc_book_urls.txt

          if [ "$missing" -ne 0 ]; then
            echo "One or more Supreme Court PDF assets are unavailable."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-law-apk
          path: yemen_laws_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
